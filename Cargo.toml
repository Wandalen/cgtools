[workspace]

resolver = "2"
members = [
  # Alias modules
  "module/alias/browser_tools",
  "module/alias/ndarray_tools",

  # Blank modules
  "module/blank/cg_tools",
  "module/blank/cgtools",
  "module/blank/d3_scene",
  "module/blank/frame_graph",
  "module/blank/mdmath",
  "module/blank/mdmath_ai",
  "module/blank/mdmath_cg",
  "module/blank/mdmath_linalg",

  # Min modules
  "module/min/mingl",
  "module/min/minwebgl",
  "module/min/minwebgpu",
  "module/min/minwgpu",
  "module/min/minvulkan",

  # Shader modules
  "module/shader/shader_chunks_core",
  "module/shader/shader_chunks_cli_core",
  "module/shader/shader_chunks_query_core",
  "module/shader/shader_chunks_query",
  "module/shader/shader_chunks_compose",
  "module/shader/shader_chunks_params_core",
  "module/shader/shader_chunks_params",
  "module/shader/shader_chunks_preview_core",
  "module/shader/shader_chunks_preview",
  "module/shader/shader_chunks_preview_web",
  "module/shader/shader_chunks_render_core",
  "module/shader/shader_chunks_render",
  "module/shader/shader_chunks_validate_core",
  "module/shader/shader_chunks_validate",
  "module/shader/shader_chunks",

  # Helper modules
  "module/helper/animation",
  "module/helper/browser_input",
  "module/helper/browser_log",
  "module/helper/canvas_renderer",
  "module/helper/embroidery_tools",
  "module/helper/primitive_generation",
  "module/helper/line_tools",
  "module/helper/gl_uniforms",
  "module/helper/gpu_hal",
  "module/helper/gpu_picking",
  "module/helper/renderer",
  "module/helper/tilemap_renderer",
  "module/helper/tiles_tools",
  "module/helper/behaviour_tree",
  "module/helper/tilemap_scene",
  "module/helper/scene_script",

  # Math modules
  "module/math/mdmath_core",
  "module/math/ndarray_cg",

  # Examples
  #
  # Symbol `*` usage requires that every example must contain crate.
  # If your example not related with Rust, but you need leave it one
  # one of this folders, then create empty crate and build will be successful.
  "examples/minwebgl/*",
  "examples/minwebgpu/*",
  "examples/minwgpu/*",
  "examples/math/*",
  "examples/orrery/*",
  "examples/scene_script/*",
  "examples/tiles_tools/*",
  "examples/gpu_hal/*",
  "examples/renderer/*",
  "examples/tilemap_renderer/*",
]

# API-group symlinks into scene-family dirs ( e.g. examples/minwebgpu/orrery ->
# ../orrery/webgpu ) are discoverability pointers, not second member paths —
# excluded so the member globs above don't resolve the same package twice.
exclude = [
  "examples/minwebgpu/orrery",
]

# Source :: https://github.com/obox-systems/conventions/blob/master/code_style.md#lints-and-warnings
[workspace.lints.rust]
# Enforces idiomatic Rust 2018 practices.
rust_2018_idioms = { level = "deny", priority = -1 }
# Prevents use of unstable features.
future_incompatible = "warn"
# # Encourages documentation for public items.
missing_docs = "warn"
# # Suggests implementing Debug for public types.
# missing_debug_implementations = "warn" # qqq : uncomment please
# Warns against using unsafe code.
unsafe-code = "warn"
# `web_sys_unstable_apis` is a raw `--cfg` opt-in consumed by web-sys itself ( see BUG-053 and
# minwebgl/src/texture/d2.rs ); declare it so referencing it is not `unexpected_cfgs`.
unexpected_cfgs = { level = "warn", check-cfg = [ "cfg(web_sys_unstable_apis)" ] }

[workspace.lints.clippy]
# Individual restriction lints (not as a group per clippy recommendations)
# Common useful restriction lints
wildcard_imports = "warn"
else_if_without_else = "warn"
# Inlining is left to LLVM/wasm-opt; per-item #[inline] on hundreds of small accessors is noise.
missing_inline_in_public_items = "allow"
# Data-bag structs/enums constructed and matched literally are the API contract here.
exhaustive_enums = "allow"
exhaustive_structs = "allow"
# GPU/game interop crosses u32/i32/f32/usize at every GL/WGPU/grid boundary; per-site annotation drowns the code.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
# Allows short/single-character identifiers (e.g. loop indices, math variables).
min_ident_chars = "allow"
# Enforces strict coding styles.
pedantic = { level = "warn", priority = -1 }
# Requires documentation for unsafe blocks.
undocumented_unsafe_blocks = "deny"
# Allows std imports; crates here always link std (wasm32 + host dev builds via web-sys/wasm-bindgen), never no_std.
std_instead_of_core = "allow"
# Allows std imports where alloc would suffice (same no_std rationale as above).
std_instead_of_alloc = "allow"
# Allows field assignment after Default::default() instead of forcing struct-update syntax.
field_reassign_with_default = "allow"
# Allows doc comments without requiring backticks around every code term.
doc_markdown = "allow"
# Allows functions called only once.
single_call_fn = "allow"
# Permits #[ inline( always ) ] usage.
inline_always = "allow"
# Allows repeated module names.
module_name_repetitions = "allow"
# Permits absolute paths in code.
absolute_paths = "allow"
# Allows pub use patterns (needed for mod_interface macro)
pub_use = "allow"
# Allows mod.rs files (used in this codebase intentionally)
mod_module_files = "allow"
# Allows self-named module files (format.rs instead of format/mod.rs)
self_named_module_files = "allow"
# Allows allow attributes (needed for targeted allows)
allow_attributes = "allow"
# Every remaining allow/expect must carry reason = "..." — suppressions are exceptional and self-documenting.
allow_attributes_without_reason = "warn"
# Allows arbitrary source item ordering
arbitrary_source_item_ordering = "allow"
# Allows missing docs in private items (not required for private)
missing_docs_in_private_items = "allow"
# Allows many single char names in mathematical contexts
many_single_char_names = "allow"
# Allows structs with many bool fields (e.g. Capabilities in tilemap_renderer)
struct-excessive-bools = "allow"

