[package]
name = "mdmath_core"
version = "0.4.0"
edition = "2021"
rust-version = "1.81.0"
authors = ["Kostiantyn Mysnyk <wandalen@obox.systems>"]
license = "MIT"
repository = "https://github.com/Wandalen/cgtools"
homepage = "https://github.com/Wandalen/cgtools/tree/master/module/math/mdmath_core"
documentation = "https://docs.rs/mdmath_core"
readme = "readme.md"
description = "Core multidimensional mathematics library with fundamental types, traits, and operations"
keywords = ["math", "multidimensional", "linear-algebra", "traits", "core"]
categories = ["mathematics", "no-std", "science", "api-bindings"]
include = [
    "src/**/*",
    "tests/**/*",
    "Cargo.toml",
    "readme.md",
    "license*",
    "changelog*",
]

[lints]
workspace = true

[features]

enabled = [
  "dep:mod_interface",
  "dep:clone_dyn_types",
]
default = [
  "enabled",
]
full = [
  "default",
  "index",
  "nd",
  "arithmetics",
]

index = [ "dep:ndarray" ]
nd = [ "dep:ndarray" ]
float = [ "nd", "dep:num-traits" ]
approx = [ "float", "dep:approx" ]
# Fix(BUG-270): `arithmetics` now also requires `approx`.
# Root cause: `src/vector/arithmetics.rs`'s `is_orthogonal` unconditionally uses
# `crate::approx::ulps_eq` and bounds `E : approx::UlpsEq` with no `#[cfg(feature = "approx")]`
# guard, so the file has always needed `approx` to compile -- `arithmetics` alone (or the `full`
# bundle, which pulls in `arithmetics` but not `approx`) failed to build with E0432/E0433.
# Pitfall: a feature flag whose gated source file unconditionally uses another feature's items
# only fails when someone actually selects that exact combination -- `--all-features` (and any
# combination that happens to also enable the second feature separately, e.g. this crate's own
# sibling `ndarray_cg` explicitly requesting both) never exercises the gap.
arithmetics = [ "float", "approx" ]

[dependencies]
mod_interface = { workspace = true, optional = true }
clone_dyn_types = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true, features = [] }
approx = { workspace = true, optional = true, features = [] }
num-traits = { workspace = true, optional = true, features = [] }

[dev-dependencies]
test_tools = { workspace = true }

# Metadata for crates.io
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
default-target = "x86_64-unknown-linux-gnu"
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "wasm32-unknown-unknown",
]

# Cargo.toml maintenance metadata
[package.metadata.release]
pre-release-replacements = [
    { file = "readme.md", search = "mdmath_core = \"[0-9.]+\"", replace = "mdmath_core = \"{{version}}\"" },
    { file = "changelog.md", search = "## Unreleased", replace = "## Unreleased\n\n## {{version}} - {{date}}" },
]
