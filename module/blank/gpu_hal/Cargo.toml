[package]
name = "gpu_hal"
version = "0.1.0"
edition = "2021"
authors = [ "Kostiantyn Mysnyk <wandalen@obox.systems>" ]
license = "MIT"
rust-version = "1.81.0"
repository = "https://github.com/Wandalen/cgtools"
description = "GPU hardware abstraction layer over the min* drivers (reserved)"
readme = "readme.md"
