[package]
name = "minwgpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Kostiantyn Mysnyk <wandalen@obox.systems>"]
license = "MIT"
description = "Minimal, opinionated wgpu toolkit — builders and helpers for context, buffer, and pipeline setup"
keywords = ["wgpu", "graphics", "minimal", "gpu", "rendering"]
categories = ["graphics", "rendering"]
repository = "https://github.com/Wandalen/cgtools"
homepage = "https://github.com/Wandalen/cgtools/tree/master/module/min/minwgpu"
documentation = "https://docs.rs/minwgpu"
include = [
    "src/**/*",
    "tests/**/*",
    "Cargo.toml",
    "readme*",
    "license*",
    "changelog*",
]

[dependencies]
wgpu.workspace = true
pollster.workspace = true
mingl.workspace = true
error_tools.workspace = true
asbytes.workspace = true

[dev-dependencies]
wgpu.workspace = true
asbytes.workspace = true

[lints]
workspace = true
