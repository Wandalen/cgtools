[package]
name = "minwebgl"
version = "0.3.0"
edition = "2021"
rust-version = "1.81.0"
authors = ["Kostiantyn Mysnyk <wandalen@obox.systems>"]
license = "MIT"
repository = "https://github.com/Wandalen/cgtools"
homepage = "https://github.com/Wandalen/cgtools/tree/master/module/min/minwebgl"
documentation = "https://docs.rs/minwebgl"
description = "Minimal WebGL toolkit for concise graphics programming with utilities, shaders, and resource management"
readme = "readme.md"
keywords = ["webgl", "graphics", "minimal", "wasm", "shaders"]
categories = ["graphics", "web-programming", "rendering", "wasm"]
include = [
    "src/**/*",
    "tests/**/*",
    "Cargo.toml",
    "readme.md",
    "license*",
    "changelog*",
]

[lints]
workspace = true

[features]

# Fix(BUG-279): `enabled` now also requires `mingl/web` and `mingl/web_log`.
# Root cause: `lib.rs` compiles `layer exec_loop;` and `layer log;` unconditionally (no
# per-layer `#[cfg]` at all) under `enabled` alone, and both `reuse ::mingl::web::exec_loop;` /
# `reuse ::mingl::web::log;` unconditionally -- but `mingl::web` itself is gated behind
# `#[cfg(feature = "web")]`, and `mingl::web::log` additionally behind `#[cfg(feature =
# "web_log")]`, in `mingl/src/lib.rs` / `mingl/src/web.rs`; `enabled` never forwarded either.
# Selecting `enabled` alone (or any combination that omits this crate's own `web`/`log`
# features) failed with E0433 "cannot find `web` in `mingl`" (then, once `web` alone was added,
# "cannot find `log` in `web`") the moment `exec_loop`/`log` tried to resolve their `reuse`
# targets -- even though `enabled` already hard-requires `dep:web-sys` / `dep:wasm-bindgen` /
# `dep:wasm-bindgen-futures` / `dep:js-sys` directly, the same dependencies `mingl/web` itself
# gates, so this crate was never meaningfully usable without them regardless.
# Pitfall: a `layer` with no per-item `#[cfg]` reads as "always available," but if its body
# `reuse`s from an optionally-gated path in another crate, it silently inherits that crate's
# gate as a real (but unstated) prerequisite -- grep every unconditional `layer` for `reuse`
# targets that cross an optional-feature boundary in the crate it reuses from, and check for
# *nested* gates one level deeper (here, `web_log` gating `log` from inside the already-gated
# `web` layer) rather than stopping at the first resolved layer.
enabled = [
  "dep:mingl",
  "dep:asbytes",
  "dep:browser_log",
  "dep:wasm-bindgen-futures",
  "dep:wasm-bindgen",
  "dep:js-sys",
  "dep:web-sys",
  "mingl/web",
  "mingl/web_log",
]
default = [
  "enabled",
  "constants",
  "diagnostics",
  "web",
  "future",
  "file",
  "log"
]
full = [
  "default",
]

constants = [] # reflect contants

# diagnostics
# Fix(BUG-274): `diagnostics` now also requires `future` and `file`.
# Root cause: `src/diagnostics.rs` unconditionally does `own use crate::model::obj;`, but
# `lib.rs` gates `layer model;` (the module that `obj` lives under) behind
# `all( feature = "future", feature = "file" )`, not behind `model_obj` -- so enabling
# `diagnostics` (which only forwarded `model_obj`) left `crate::model` itself configured out,
# failing with E0432 "unresolved import `crate::model`" the moment `diagnostics` was selected
# without also separately selecting both `future` and `file`.
# Pitfall: a feature that transitively needs a `layer`/module gated by a *different* cfg
# predicate than the one it directly forwards only breaks when someone selects it without also
# happening to select the layer's own gate -- `--all-features` and this crate's own `default`
# bundle (which lists `future`/`file` alongside `diagnostics` anyway) never exercise the gap.
diagnostics = [
  "mingl/diagnostics",
  "model_obj",
  "future",
  "file"
]

web = [ "mingl/web", "mingl/web_log" ] # common web utils
file = [ "mingl/web_file" ] # enable files handling
future = [ "mingl/web_future" ] # enable futures
model_obj = [ "mingl/web_model_obj" ] # enable futures
log = [ "mingl/web_log" ]

math = [ "mingl/math" ]

[dependencies]

# = internal

mingl = { workspace = true, optional = true }

# = external

asbytes = { workspace = true, optional = true }
browser_log = { workspace = true, optional = true }

tobj =  { workspace = true, optional = true }

wasm-bindgen-futures = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
  'HtmlCanvasElement',
  'Window',
  'Document',
  'HtmlCollection',
  'CssStyleDeclaration',
  'HtmlElement',
  'ConsoleInstance',
  'console',
  'WebGl2RenderingContext',
  'WebGlProgram',
  'WebGlShader',
  'WebGlBuffer',
  'WebGlVertexArrayObject',
  'WebGlUniformLocation',
  'RequestInit',
  'RequestMode',
  'Request',
  'Response',
  'Location',
  'HtmlImageElement',
  'WebGlTexture',
  'HtmlVideoElement',
  'CanvasRenderingContext2d',
  'ImageData',
  'WebGlFramebuffer',
  "BlobPropertyBag",
  "Blob",
  "Url"
]}

[dev-dependencies]
test_tools = { workspace = true }

# Fix(BUG-079): feature shim, not a real dependency — `test_tools` drags in
# rand 0.8 → getrandom 0.2, which refuses to compile for wasm32-unknown-unknown
# unless its `js` backend feature is on; this switches it on for test builds only.
# Root cause: Cargo.lock resolves getrandom 0.2/0.3/0.4 side by side, and the
# `getrandom_backend="wasm_js"` cfg in `.cargo/config.toml` is invisible to the
# 0.2 generation, which predates cfg-based backend selection.
# Pitfall: deliberately version-local (not `workspace = true` — the workspace
# getrandom is 0.3+); duplicate-major resolutions need per-major activation
# (`cargo tree -i getrandom --target wasm32-unknown-unknown` shows the split).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.2", features = [ "js" ] }

# Metadata for crates.io
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
default-target = "wasm32-unknown-unknown"
targets = [
    "wasm32-unknown-unknown",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
]

# Cargo.toml maintenance metadata
[package.metadata.release]
pre-release-replacements = [
    { file = "readme.md", search = "minwebgl = \"[0-9.]+\"", replace = "minwebgl = \"{{version}}\"" },
    { file = "changelog.md", search = "## Unreleased", replace = "## Unreleased\n\n## {{version}} - {{date}}" },
]
