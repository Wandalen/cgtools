[package]
name = "mingl"
version = "0.4.0"
edition = "2021"
rust-version = "1.81.0"
authors = ["Kostiantyn Mysnyk <wandalen@obox.systems>"]
license = "MIT"
repository = "https://github.com/Wandalen/cgtools"
homepage = "https://github.com/Wandalen/cgtools/tree/master/module/min/mingl"
documentation = "https://docs.rs/mingl"
description = "Minimal graphics library with abstract rendering backend and WebGL support"
readme = "readme.md"
keywords = ["graphics", "rendering", "webgl", "minimal", "backend"]
categories = ["graphics", "rendering", "web-programming", "api-bindings"]
include = [
    "src/**/*",
    "tests/**/*",
    "Cargo.toml",
    "readme.md",
    "license*",
    "changelog*",
]

[lints]
workspace = true

[features]

enabled = [
  "dep:asbytes",
]
default = [
  "enabled",
  "math",
]
full = [
  "default",
]

math = [ "dep:ndarray_cg" ]
camera_orbit_controls = []
character_controls = []

diagnostics = [
  "model_obj"
]
model_obj = [
  "dep:tobj"
]

# Enable web related stuff
web = [
  "dep:wasm-bindgen-futures",
  "dep:wasm-bindgen",
  "dep:js-sys",
  "dep:web-sys",
]
# enable file handling on the web
web_file = []
# enable futures on the web
web_future = []
web_model_obj = [ "model_obj", "web_log", "tobj/async" ]
web_log = [ "dep:browser_log" ]

[dependencies]

asbytes = { workspace = true, optional = true }
tobj = { workspace = true, optional = true }
browser_log = { workspace = true, optional = true }

ndarray_cg = { workspace = true, optional = true }
error_tools = { workspace = true }
mod_interface = { workspace = true }
derive_tools = { workspace = true }
former = { workspace = true }

wasm-bindgen-futures = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
  'HtmlCanvasElement',
  'Window',
  'Document',
  'HtmlCollection',
  'CssStyleDeclaration',
  'HtmlElement',
  'RequestInit',
  'RequestMode',
  'Request',
  'Response',
  'Location',
  'DomTokenList',
  'HtmlVideoElement',
  'HtmlImageElement',
  'Element',
  'PointerEvent',
  'MouseEvent',
  'WheelEvent',
  'KeyboardEvent',
  'ResizeObserver',
  'console',
]}

[dev-dependencies]
test_tools = { workspace = true }
approx = { workspace = true }

# Fix(BUG-079): feature shim, not a real dependency — `test_tools` drags in
# rand 0.8 → getrandom 0.2, which refuses to compile for wasm32-unknown-unknown
# unless its `js` backend feature is on; this switches it on for test builds only.
# Root cause: Cargo.lock resolves getrandom 0.2/0.3/0.4 side by side, and the
# `getrandom_backend="wasm_js"` cfg in `.cargo/config.toml` is invisible to the
# 0.2 generation, which predates cfg-based backend selection.
# Pitfall: deliberately version-local (not `workspace = true` — the workspace
# getrandom is 0.3+); duplicate-major resolutions need per-major activation
# (`cargo tree -i getrandom --target wasm32-unknown-unknown` shows the split).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.2", features = [ "js" ] }

# Metadata for crates.io
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
default-target = "wasm32-unknown-unknown"
targets = [
    "wasm32-unknown-unknown",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
]

# Cargo.toml maintenance metadata
[package.metadata.release]
pre-release-replacements = [
    { file = "readme.md", search = "mingl = \"[0-9.]+\"", replace = "mingl = \"{{version}}\"" },
    { file = "changelog.md", search = "## Unreleased", replace = "## Unreleased\n\n## {{version}} - {{date}}" },
]
