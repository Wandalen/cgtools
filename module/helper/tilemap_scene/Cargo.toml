[package]
name = "tilemap_scene"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["cgtools contributors"]
license = "MIT"
description = "Compositional declarative scene format for 2D tile-based games — compile to tilemap_renderer commands"
readme = "readme.md"
keywords = ["tilemap", "scene", "2d", "gamedev", "tiles"]
categories = ["game-development", "rendering"]
repository = "https://github.com/Wandalen/cgtools"
homepage = "https://github.com/Wandalen/cgtools/tree/master/module/helper/tilemap_scene"
documentation = "https://docs.rs/tilemap_scene"
include = [
    "src/**/*",
    "tests/**/*",
    "Cargo.toml",
    "readme.md",
    "license*",
    "changelog*",
]

[dependencies]
error_tools = { workspace = true }
mod_interface = { workspace = true }
serde = { workspace = true, features = ["derive"] }
ron = { workspace = true }
tiles_tools = { workspace = true, features = ["serialization"] }
rustc-hash = { workspace = true }
slotmap = { workspace = true }
tilemap_renderer = { workspace = true, default-features = true, features = ["scene-model"] }

[dev-dependencies]
# `opaque_pass_test` feeds a frame to the SVG backend, which has no depth buffer.
tilemap_renderer = { workspace = true, features = ["scene-model", "adapter-svg"] }

# criterion does not build for wasm32, so the browser suites ( wasm32 only )
# can only build without it; the benchmark is native-only.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

# `webgl_renderer_test` drives the renderer into a live WebGL backend.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
tilemap_renderer = { workspace = true, features = ["scene-model", "adapter-webgl"] }
minwebgl = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = [ "HtmlCanvasElement" ] }

# Renderer::render on a 469-hex dual-grid board (the frames #207 optimised).
[[bench]]
name = "frame_render"
harness = false

[lints]
workspace = true
