[package]
name = "browser_log"
version = "0.4.0"
edition = "2021"
rust-version = "1.81.0"
authors = ["Kostiantyn Mysnyk <wandalen@obox.systems>"]
license = "MIT"
repository = "https://github.com/Wandalen/cgtools"
homepage = "https://github.com/Wandalen/cgtools/tree/master/module/helper/browser_log"
documentation = "https://docs.rs/browser_log"
description = "Advanced logging and panic handling for WebAssembly applications with browser console integration"
readme = "readme.md"
keywords = ["wasm", "logging", "browser", "webassembly", "console"]
categories = ["web-programming", "development-tools", "wasm"]
include = [
    "src/**/*",
    "tests/**/*",
    "Cargo.toml",
    "readme.md",
    "license*",
    "changelog*",
]

[lints]
workspace = true

[features]
enabled = [
  "dep:wasm-bindgen",
  "dep:web-sys",
  "dep:log",
  "dep:mod_interface",
]
default = [ "enabled" ]
full = [ "default" ]

[dependencies]
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
  'console',
]}
# Fix(BUG-354): removed the `release_max_level_info` feature — it set `log::STATIC_MAX_LEVEL`
# to `Info` at COMPILE TIME for the entire dependency graph (Cargo feature unification) in
# every release build (`cfg(not(debug_assertions))`), silently discarding every consumer's
# `log::debug!`/`log::trace!` call — including the CONSUMING application's own unrelated
# logging, not just browser_log's — regardless of the runtime level requested via
# `log::setup::setup`/`Config`. Contradicted this crate's own documented contract
# (`Config::new`'s doc comment; readme.md's "Configurable log levels for deployment").
# Root cause: `log`'s own `STATIC_MAX_LEVEL` const (log-0.4.33/src/lib.rs:1637-1650) selects
# `Info` whenever `not(debug_assertions)` and this feature is set, and `debug!`/`trace!`
# (log-0.4.33/src/macros.rs:137) gate on `lvl <= STATIC_MAX_LEVEL` before the runtime level is
# ever consulted — so the only correct level control here is the runtime one already
# implemented in `setup.rs`, never a compile-time Cargo feature cap.
# Pitfall: `release_max_level_*` features look like a reasonable "ship less log noise in
# release" default, but they cap the level for every crate sharing this dependency's feature
# set (unification), not just this one — a library crate should never opt a consuming binary
# into a level cap the binary's own author never asked for.
log = { workspace = true, optional = true, features = [ "std" ] }
mod_interface = { workspace = true, optional = true }

[dev-dependencies]
test_tools = { workspace = true }

# Fix(BUG-079): feature shim, not a real dependency — `test_tools` drags in
# rand 0.8 → getrandom 0.2, which refuses to compile for wasm32-unknown-unknown
# unless its `js` backend feature is on; this switches it on for test builds only.
# Root cause: Cargo.lock resolves getrandom 0.2/0.3/0.4 side by side, and the
# `getrandom_backend="wasm_js"` cfg in `.cargo/config.toml` is invisible to the
# 0.2 generation, which predates cfg-based backend selection.
# Pitfall: deliberately version-local (not `workspace = true` — the workspace
# getrandom is 0.3+); duplicate-major resolutions need per-major activation
# (`cargo tree -i getrandom --target wasm32-unknown-unknown` shows the split).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.2", features = [ "js" ] }

# Metadata for crates.io
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
default-target = "wasm32-unknown-unknown"
targets = [
    "wasm32-unknown-unknown",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
]

# Cargo.toml maintenance metadata
[package.metadata.release]
pre-release-replacements = [
    { file = "readme.md", search = "browser_log = \"[0-9.]+\"", replace = "browser_log = \"{{version}}\"" },
    { file = "changelog.md", search = "## Unreleased", replace = "## Unreleased\n\n## {{version}} - {{date}}" },
]

