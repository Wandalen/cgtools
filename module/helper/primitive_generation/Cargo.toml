[package]
name = "primitive_generation"
version = "0.1.0"
edition = "2021"
rust-version = "1.81.0"
authors = [
  "Kostiantyn Mysnyk <wandalen@obox.systems>",
  "Bilan Vadym <vadym.b@obox.systems>"
]
license = "MIT"
repository = "https://github.com/Wandalen/cgtools"
homepage = "https://github.com/Wandalen/cgtools/tree/master/module/helper/primitive_generation"
documentation = "https://docs.rs/primitive_generation"
description = "3D geometry generation toolkit with primitives, text rendering, and procedural shape creation"
readme = "readme.md"
keywords = ["geometry", "3d", "primitives", "mesh", "graphics"]
categories = ["graphics", "game-development", "mathematics", "rendering"]
include = [
    "src/**/*",
    "tests/**/*",
    "Cargo.toml",
    "readme.md",
    "license*",
    "changelog*",
]

[lints]
workspace = true

[features]
default = ["enabled"]

# Core geometry generation functionality
enabled = [
    "dep:mod_interface",
    "dep:minwebgl",
    "dep:mingl",
    "dep:renderer",
    "dep:web-sys",
    "dep:rustc-hash"
]

# Full feature set with all geometry types
full = ["enabled", "text", "font-processing"]

# Vector path machinery: flattening kurbo paths into point sequences
text = ["enabled", "dep:kurbo"]

# UFO font loading and text-to-mesh generation (triangulated fill via earcutr)
font-processing = ["text", "dep:earcutr", "dep:norad", "dep:quick-xml"]

[dependencies]
mod_interface = { workspace = true, optional = true }
minwebgl = { workspace = true, features = [ "future", "math", "diagnostics" ], optional = true }
mingl = { workspace = true, features = [ "camera_orbit_controls" ], optional = true }
renderer = { workspace = true, features = [ "full" ], optional = true }
kurbo = { workspace = true, optional = true }
norad = { workspace = true, features = [ "kurbo" ], optional = true }
quick-xml = { workspace = true, optional = true }
earcutr = { workspace = true, optional = true }
rustc-hash = { workspace = true, optional = true }

[dependencies.web-sys]
workspace = true
optional = true
features = [
  'MouseEvent',
  'PointerEvent',
  'WheelEvent',
  'WebGlTexture',
  'HtmlImageElement',
  'Blob',
  'BlobPropertyBag',
  'Url',
  'WebGlFramebuffer',
  'WebGlRenderbuffer'
]

[dev-dependencies]
test_tools = { workspace = true }
kurbo = { workspace = true }

# Exercises `contours_to_fill_geometry`, which is gated behind `font-processing`
# (TASK-055) -- without `required-features`, this test binary would fail to
# *compile* (not just skip) whenever the feature is off.
[[test]]
name = "contours_to_fill_geometry_test"
required-features = ["font-processing"]

# Exercises `path_to_points`, gated behind `text` -- same required-features
# rationale as above.
[[test]]
name = "path_to_points_test"
required-features = ["text"]

# Exercise the UFO glyph pipeline (`Glyph::from_glif`, `text_to_mesh`,
# `text_to_countour_mesh`), gated behind `font-processing`.
[[test]]
name = "ufo_glif_point_type_test"
required-features = ["font-processing"]

[[test]]
name = "ufo_text_advance_test"
required-features = ["font-processing"]

# Metadata for crates.io
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
default-target = "wasm32-unknown-unknown"
targets = [
    "wasm32-unknown-unknown",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
]

# Cargo.toml maintenance metadata
[package.metadata.release]
pre-release-replacements = [
    { file = "readme.md", search = "primitive_generation = \"[0-9.]+\"", replace = "primitive_generation = \"{{version}}\"" },
    { file = "changelog.md", search = "## Unreleased", replace = "## Unreleased\n\n## {{version}} - {{date}}" },
]
