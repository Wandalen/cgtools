[package]
name = "gpu_hal"
version = "0.1.0"
edition = "2021"
authors = [ "Kostiantyn Mysnyk <wandalen@obox.systems>" ]
license = "MIT"
rust-version = "1.81.0"
repository = "https://github.com/Wandalen/cgtools"
description = "GPU hardware abstraction layer over the min* drivers"
readme = "readme.md"
keywords = ["gpu", "hal", "webgl", "webgpu", "wasm"]

[lints]
workspace = true

[features]
enabled = [
  "dep:mod_interface",
]
webgpu = [ "dep:minwebgpu" ]
webgl = [ "dep:minwebgl", "dep:web-sys" ]
native = [ "dep:minwgpu", "dep:wgpu" ]
# Built on minvulkan + ash directly, and naga for WGSL->SPIR-V translation
# ( naga has no wgpu dependency of its own — wgpu depends on naga, not the
# reverse ). Deliberately does not depend on `minwgpu` or `wgpu` — see
# docs/adr/004_native_vulkan_hal_backend.md.
vulkan = [ "dep:minvulkan", "dep:ash", "dep:naga" ]
default = [ "enabled" ]
full = [ "default", "webgpu", "webgl", "native", "vulkan" ]

[dependencies]

mod_interface = { workspace = true, optional = true }
minwebgpu = { workspace = true, features = [ "math" ], optional = true }
minwebgl = { workspace = true, optional = true }
# The WebGL backend maps SamplerDesc onto GL sampler objects, which
# minwebgl's own web-sys feature set does not enable; feature unification
# adds them to the shared web-sys instance minwebgl re-exports.
web-sys = { workspace = true, optional = true, features = [ "WebGl2RenderingContext", "WebGlSampler" ] }
# The native backend builds its context through minwgpu ( which does not
# re-export wgpu ) and holds raw wgpu objects in its handle variants — the
# same split as minwebgl + web-sys above.
minwgpu = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
# The vulkan backend builds through minvulkan + raw ash calls — it must never
# gain a wgpu/minwgpu dependency, per docs/adr/004_native_vulkan_hal_backend.md.
minvulkan = { workspace = true, optional = true }
ash = { workspace = true, features = [ "loaded" ], optional = true }
# WGSL->SPIR-V translation only ( naga itself has no wgpu dependency ); spv-out
# adds to the workspace-level wgsl-in already enabled for the `renderer` crate.
naga = { workspace = true, features = [ "spv-out" ], optional = true }
