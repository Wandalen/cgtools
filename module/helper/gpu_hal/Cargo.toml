[package]
name = "gpu_hal"
version = "0.1.0"
edition = "2021"
authors = [ "Kostiantyn Mysnyk <wandalen@obox.systems>" ]
license = "MIT"
rust-version = "1.81.0"
repository = "https://github.com/Wandalen/cgtools"
description = "GPU hardware abstraction layer over the min* drivers"
readme = "readme.md"
keywords = ["gpu", "hal", "webgl", "webgpu", "wasm"]

[lints]
workspace = true

[features]
enabled = [
  "dep:mod_interface",
]
webgpu = [ "dep:minwebgpu" ]
webgl = [ "dep:minwebgl", "dep:web-sys" ]
native = [ "dep:minwgpu", "dep:wgpu" ]
# Built on minvulkan + ash directly, and naga for WGSL->SPIR-V translation
# ( naga has no wgpu dependency of its own — wgpu depends on naga, not the
# reverse ). Deliberately does not depend on `minwgpu` or `wgpu` — see
# docs/adr/004_native_vulkan_hal_backend.md.
vulkan = [ "dep:minvulkan", "dep:ash", "dep:naga", "naga/spv-out" ]
# Build-time-only WGSL->GLSL ES 300 translation ( `webgl_build` module ), for
# use as a `build.rs` build-dependency by a downstream crate targeting
# gpu_hal's WebGL backend — independent of the `webgl` feature itself, and
# of `vulkan`; shares the optional `naga` dependency, requesting only its
# GLSL backend.
webgl-glsl-build = [ "dep:naga", "naga/glsl-out" ]
default = [ "enabled" ]
full = [ "default", "webgpu", "webgl", "native", "vulkan", "webgl-glsl-build" ]

[dependencies]

# Non-optional: `types.rs`'s struct/enum definitions ( including `VertexBufferLayout::step_mode`,
# typed `mingl::StepMode` ) are never `#[cfg]`-gated -- they compile regardless of which backend
# feature ( webgl/webgpu/native/vulkan ) is active, so this dependency can't be gated behind any of
# them either.
mingl = { workspace = true }
mod_interface = { workspace = true, optional = true }
minwebgpu = { workspace = true, features = [ "math" ], optional = true }
minwebgl = { workspace = true, optional = true }
# The WebGL backend maps SamplerDesc onto GL sampler objects, which
# minwebgl's own web-sys feature set does not enable; feature unification
# adds them to the shared web-sys instance minwebgl re-exports.
web-sys = { workspace = true, optional = true, features = [ "WebGl2RenderingContext", "WebGlSampler" ] }
# The native backend builds its context through minwgpu and holds raw wgpu
# objects in its handle variants, which appear in this crate's own public
# signatures — so wgpu is named directly here rather than reached through
# minwgpu's re-export, the same split as minwebgl + web-sys above. A consumer
# that only *calls* this crate needs neither entry.
minwgpu = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
# Backend feature ( spv-out / glsl-out ) requested per activating feature,
# above; wgsl-in comes from the workspace-level default already enabled for
# the `renderer` crate ( naga itself has no wgpu dependency ).
naga = { workspace = true, optional = true }

# `ash`/`minvulkan` are native-only ( `ash`'s own `libloading` dependency has
# no wasm32 support ) -- declaring them here rather than in `[dependencies]`
# keeps Cargo from ever attempting to compile them for wasm32-unknown-unknown,
# even when the `vulkan` feature is nominally active via `--all-features`
# ( e.g. `verb/test`'s wasm32 stage ). The crate's own `#[cfg(...)]` gates on
# vulkan code already combine `feature = "vulkan"` with `not(target_arch =
# "wasm32")` ( device.rs, pass.rs, resource.rs, error.rs, lib.rs ) -- this
# mirrors that boundary at the dependency-graph level so the two can never
# drift apart. See docs/adr/004_native_vulkan_hal_backend.md.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
minvulkan = { workspace = true, optional = true }
ash = { workspace = true, features = [ "loaded" ], optional = true }

[dev-dependencies]
# Drives tests/webgl_backend_test.rs -- the real, browser-executed WebGL
# backend test; run via `cargo test --target wasm32-unknown-unknown` through
# the runner wired up in the workspace's .cargo/config.toml.
wasm-bindgen-test = { workspace = true }
