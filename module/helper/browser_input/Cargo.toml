[package]
name = "browser_input"
version = "0.4.0"
edition = "2021"
rust-version = "1.81.0"
authors = ["Kostiantyn Mysnyk <wandalen@obox.systems>"]
license = "MIT"
repository = "https://github.com/Wandalen/cgtools"
homepage = "https://github.com/Wandalen/cgtools/tree/master/module/helper/browser_input"
documentation = "https://docs.rs/browser_input"
description = "Ergonomic input handling for WebAssembly applications in the browser with keyboard, mouse, and event processing"
readme = "readme.md"
keywords = ["webassembly", "input", "browser", "wasm", "gamedev"]
categories = ["web-programming", "game-development", "gui", "api-bindings"]
include = [
  "src/**/*",
  "tests/**/*",
  "Cargo.toml",
  "readme.md",
  "license*",
  "changelog*",
]

[lints]
workspace = true

[features]
default = ["enabled"]

# Core input handling functionality
enabled = ["dep:ndarray_cg", "dep:web-sys", "dep:strum"]

# Full feature set
full = ["enabled"]

[dependencies]
ndarray_cg = { workspace = true, optional = true }
web-sys = { workspace = true, features = [
  "Window",
  "Document",
  "KeyboardEvent",
  "PointerEvent",
  "WheelEvent",
  "Element",
  "HtmlElement",
  "CssStyleDeclaration",
], optional = true }
strum = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
test_tools = { workspace = true }

# Fix(BUG-079): feature shim, not a real dependency — `test_tools` drags in
# rand 0.8 → getrandom 0.2, which refuses to compile for wasm32-unknown-unknown
# unless its `js` backend feature is on; this switches it on for test builds only.
# Root cause: Cargo.lock resolves getrandom 0.2/0.3/0.4 side by side, and the
# `getrandom_backend="wasm_js"` cfg in `.cargo/config.toml` is invisible to the
# 0.2 generation, which predates cfg-based backend selection.
# Pitfall: deliberately version-local (not `workspace = true` — the workspace
# getrandom is 0.3+); duplicate-major resolutions need per-major activation
# (`cargo tree -i getrandom --target wasm32-unknown-unknown` shows the split).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.2", features = [ "js" ] }

# Metadata for crates.io
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
default-target = "wasm32-unknown-unknown"
targets = [
  "wasm32-unknown-unknown",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
]

# Cargo.toml maintenance metadata
[package.metadata.release]
pre-release-replacements = [
  { file = "readme.md", search = "browser_input = \"[0-9.]+\"", replace = "browser_input = \"{{version}}\"" },
  { file = "changelog.md", search = "## Unreleased", replace = "## Unreleased\n\n## {{version}} - {{date}}" },
]
