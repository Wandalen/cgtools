[package]
name = "wfc_example"
version = "0.1.0"
edition = "2021"
authors = [ 
  "Kostiantyn Mysnyk <wandalen@obox.systems>",
  "Bilan Vadym <vadym.b@obox.systems>"
]
license = "MIT"

[dependencies]
# wfc_image 0.12 (latest) still requires image ^0.24 — pinned down for type interop.
image = { version = "0.24", features = ["rayon"] }
RustyXML = "0.3.0"
wfc_algo = { package = "wfc", version = "0.10", features = [ "js" ] }
wfc_image = { workspace = true, features = ["parallel"] }
minwebgl = { workspace = true }
mingl = { workspace = true }
getrandom = { version = "0.4", features = [ "wasm_js" ] }
rand = { version = "0.10.2" }
ndarray_cg = { workspace = true }
quick-xml = { workspace = true }

[dependencies.web-sys]
workspace = true
features = [
  'Document',
  'Element',
  'HtmlCanvasElement',
  'Window',
  'WebGlTexture',
  'CanvasRenderingContext2d',
  'HtmlImageElement',
  'HtmlButtonElement',
  'DomRect',
  'HtmlInputElement', 
  'Event',
  'InputEvent',
  'File',
  'FileList',
  'FileReader',
]

[package.metadata.action]
tags = ["runtime:browser", "api:webgl"]

[lints]
workspace = true
