[package]
name = "minwebgl_sun_grid_lines"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
renderer = { workspace = true }

# Scene-script parsing (scene.rs) has no wasm/WebGL dependency and is
# unit-tested natively, so serde/rhai/scene_script are unconditional, not
# target-gated.
serde = { workspace = true, features = [ "derive" ] }
rhai = { workspace = true, features = [ "serde" ] }
scene_script = { workspace = true }

# Only include WebGL and related dependencies for wasm32 targets
[target.'cfg(target_arch = "wasm32")'.dependencies]
minwebgl = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
features = [
  "KeyboardEvent",
]
workspace = true

[package.metadata.action]
tags = ["runtime:browser", "api:webgl"]

[lints]
workspace = true
