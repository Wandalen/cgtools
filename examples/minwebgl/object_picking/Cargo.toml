[package]
name = "object_picking"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = { workspace = true }
getrandom = { workspace = true, features = [ "wasm_js" ] }
ndarray_cg = { workspace = true }
minwebgl = { workspace = true, features = ['future'] }
mingl = { workspace = true }
tobj = { workspace = true, features = ['async'] }
[dependencies.web-sys]
features = [
  'HtmlImageElement',
  'WebGlTexture',
  'WebGlFramebuffer',
  'WebGlRenderbuffer',
  'MouseEvent',
  'DomRect',
  'Window',
]
workspace = true

[package.metadata.action]
tags = ["runtime:browser", "api:webgl"]

[lints]
workspace = true
