[package]
name = "minwebgl_text_msdf"
version = "0.1.0"
edition = "2021"
authors = [ 
  "Kostiantyn Mysnyk <wandalen@obox.systems>",
  "Avramenko Yevhenii <yevhenii.av@obox.systems>" 
]

[dependencies]
minwebgl = { workspace = true, features = [ "future", "file", "math" ] }
mingl = { workspace = true }
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.151"

[dependencies.bytemuck]
version = "1.25.2"
features = [ "derive" ]

[dependencies.web-sys]
workspace = true
features = [
  'KeyboardEvent',
]

[package.metadata.action]
tags = ["runtime:browser", "api:webgl"]

[lints]
workspace = true
