[package]
name = "gpu_hal_triangle_browser"
version = "0.1.0"
edition = "2021"
authors = [
  "Kostiantyn Mysnyk <wandalen@obox.systems>"
]
license = "MIT"

# Only include browser-backend dependencies for wasm32 targets
[target.'cfg(target_arch = "wasm32")'.dependencies.gpu_hal]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies.mingl]
workspace = true
features = [
    'web'
]

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen-futures]
workspace = true
optional = true

# Stub dependency for other targets to allow compilation
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# No gpu_hal dependency for native targets

[features]
default = [ "webgpu" ]
webgpu = [ "gpu_hal/webgpu", "dep:wasm-bindgen-futures" ]
webgl = [ "gpu_hal/webgl" ]

[lints]
workspace = true

[package.metadata.action]
tags = ["runtime:browser", "api:webgpu", "api:webgl"]
