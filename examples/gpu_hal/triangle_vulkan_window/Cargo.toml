[package]
name = "gpu_hal_triangle_vulkan_window"
version = "0.1.0"
edition = "2024"
description = "Windowed triangle on gpu_hal's Vulkan backend — a real VK_KHR_swapchain, no wgpu linked"

[dependencies]
# `vulkan` on top of the default `enabled`. No `native`, so no `wgpu` is pulled
# in transitively either -- this example's whole point is a process that links
# none at all.
gpu_hal = { workspace = true, features = [ "vulkan" ] }
# Windowing only, which is neither computer graphics nor math. gpu_hal takes the
# window as raw handle traits, reached here through `minvulkan`'s own re-export
# rather than a second copy of `raw-window-handle` declared here.
winit.workspace = true

[lints]
workspace = true

[package.metadata.action]
tags = ["runtime:native", "api:vulkan"]
