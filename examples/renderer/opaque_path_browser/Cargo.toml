[package]
name = "renderer_opaque_path_browser"
version = "0.1.0"
edition = "2021"
authors = [
  "Kostiantyn Mysnyk <wandalen@obox.systems>"
]
license = "MIT"

# Only include browser-backend dependencies for wasm32 targets
[target.'cfg(target_arch = "wasm32")'.dependencies.renderer]
workspace = true
features = [ "webgpu" ]

[target.'cfg(target_arch = "wasm32")'.dependencies.minwebgpu]
workspace = true
features = [ "math" ]

[target.'cfg(target_arch = "wasm32")'.dependencies.mingl]
workspace = true
features = [ "web" ]

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen-futures]
workspace = true
optional = true

# Stub dependency for other targets to allow compilation
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# No renderer dependency for native targets

[features]
default = [ "webgpu" ]
webgpu = [ "dep:wasm-bindgen-futures" ]
webgl = []

[lints]
workspace = true

[package.metadata.action]
tags = ["runtime:browser", "api:webgpu", "api:webgl"]
